name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Update registry index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Type check (warnings are errors)
        run: moon check --deny-warn

      - name: Check corpus tool
        run: python3 -m py_compile tools/corpus_check.py

      - name: Unit and integration tests
        run: moon test --target native

      - name: Render fixtures
        run: |
          mkdir -p out
          moon run --target native cmd/moonpdf -- fixtures/shapes.pdf out/shapes.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/text.pdf out/text.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/demo.pdf out/demo.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/incremental.pdf out/incremental.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/incremental-full.pdf out/incremental-full.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/xref-stream.pdf out/xref-stream.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/image-flate.pdf out/image-flate.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/image-jpeg.pdf out/image-jpeg.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/inline-image.pdf out/inline-image.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/rotate-crop.pdf out/rotate-crop.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/clip.pdf out/clip.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-embedded.pdf out/font-embedded.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-cff.pdf out/font-cff.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-cid.pdf out/font-cid.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-type1.pdf out/font-type1.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-type1-pfa.pdf out/font-type1-pfa.png --scale 2
          mkdir -p out/pages
          moon run --target native cmd/moonpdf -- fixtures/pages.pdf --pages 1-2 --out-dir out/pages --scale 1
          moon run --target native cmd/moonpdf -- fixtures/font-cid-cff.pdf out/font-cid-cff.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-cid-cmap.pdf out/font-cid-cmap.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-named-cmap.pdf out/font-named-cmap.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/alpha.pdf out/alpha.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/blend.pdf out/blend.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/clip-path.pdf out/clip-path.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/shading.pdf out/shading.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/pattern.pdf out/pattern.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/tiling-pattern.pdf out/tiling-pattern.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/uncolored-pattern.pdf out/uncolored-pattern.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/annotation.pdf out/annotation.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/widget-states.pdf out/widget-states.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/optional-content.pdf out/optional-content.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/annotation-flags.pdf out/annotation-flags.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/soft-mask.pdf out/soft-mask.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/shapes.pdf out/shapes.svg --scale 2 --svg
          moon run --target native cmd/moonpdf -- fixtures/vector-paths.pdf out/vector-paths.svg --scale 2 --svg
          moon run --target native cmd/moonpdf -- fixtures/image-flate.pdf out/image-flate.svg --scale 1 --svg
          moon run --target native cmd/moonpdf -- fixtures/clip-path.pdf out/clip-path.svg --scale 2 --svg
          moon run --target native cmd/moonpdf -- fixtures/font-embedded.pdf out/font-embedded.svg --scale 2 --svg
          moon run --target native cmd/moonpdf -- fixtures/transparency-group.pdf out/transparency-group.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/soft-mask-extgstate.pdf out/soft-mask-extgstate.png --scale 2

      - name: Verify PNG output and reused-resource pixels
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def read_png(path):
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", path
              pos = 8
              idat = bytearray()
              width = height = 0
              depth = color = 0
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos + 4])[0]
                  kind = data[pos + 4:pos + 8]
                  chunk = data[pos + 8:pos + 8 + length]
                  if kind == b"IHDR":
                      width, height = struct.unpack(">II", chunk[:8])
                      depth, color = chunk[8], chunk[9]
                  elif kind == b"IDAT":
                      idat += chunk
                  pos += 12 + length
              assert depth == 8 and color == 2, (path, depth, color)
              raw = zlib.decompress(bytes(idat))
              return width, height, raw, width * 3 + 1

          def pixel(raw, stride, x, y):
              offset = y * stride + 1 + x * 3
              return tuple(raw[offset:offset + 3])

          expected = {
              "shapes.png": (600, 400),
              "text.png": (800, 600),
              "demo.png": (1200, 720),
              "incremental.png": (600, 400),
              "incremental-full.png": (600, 400),
              "xref-stream.png": (640, 400),
              "image-flate.png": (400, 400),
              "image-jpeg.png": (400, 400),
              "inline-image.png": (400, 400),
              "rotate-crop.png": (320, 600),
              "clip.png": (400, 400),
              "font-embedded.png": (680, 300),
              "font-cff.png": (680, 300),
              "font-cid.png": (680, 300),
              "font-type1.png": (680, 300),
              "font-type1-pfa.png": (800, 300),
              "font-cid-cff.png": (600, 300),
              "font-cid-cmap.png": (600, 300),
              "font-named-cmap.png": (600, 300),
              "alpha.png": (400, 400),
              "blend.png": (400, 400),
              "clip-path.png": (400, 400),
              "shading.png": (400, 400),
              "pattern.png": (400, 400),
              "tiling-pattern.png": (400, 400),
              "uncolored-pattern.png": (400, 400),
              "annotation.png": (400, 400),
              "widget-states.png": (400, 400),
              "optional-content.png": (400, 400),
              "annotation-flags.png": (400, 400),
              "soft-mask.png": (400, 400),
          }
          for name, size in expected.items():
              width, height, raw, stride = read_png(Path("out") / name)
              assert (width, height) == size, (name, width, height)
              print(f"{name}: {width}x{height}")

          # Incremental update: old Form XObject header (blue) is reused, and the
          # appended body stream (green) is rendered below it.
          width, height, raw, stride = read_png(Path("out/incremental.png"))
          blue = pixel(raw, stride, 500, 40)
          green = pixel(raw, stride, 500, 250)
          assert blue[2] > 150 and blue[0] < 100, blue
          assert green[1] > 120 and green[2] < 120, green
          print("incremental: reused header", blue, "new body", green)
          assert (Path("out/incremental.png").read_bytes()
                  == Path("out/incremental-full.png").read_bytes()), "incremental != full rewrite"

          # Xref-stream/object-stream/Flate fixture: blue rectangle from the page.
          width, height, raw, stride = read_png(Path("out/xref-stream.png"))
          blue = pixel(raw, stride, 100, 100)
          assert blue[2] > 150 and blue[0] < 100, blue
          print("xref-stream: page content", blue)

          # JPEG quadrants (red/blue/green/yellow).
          width, height, raw, stride = read_png(Path("out/image-jpeg.png"))
          red = pixel(raw, stride, 140, 140)
          blue = pixel(raw, stride, 260, 140)
          green = pixel(raw, stride, 140, 260)
          yellow = pixel(raw, stride, 260, 260)
          assert red[0] > 150 and red[1] < 90, red
          assert blue[2] > 150 and blue[0] < 90, blue
          assert green[1] > 150 and green[0] < 90, green
          assert yellow[0] > 180 and yellow[2] < 120, yellow
          print("jpeg quadrants", red, blue, green, yellow)

          # Rotate 90 + CropBox: red top half, blue bottom half.
          width, height, raw, stride = read_png(Path("out/rotate-crop.png"))
          assert (width, height) == (320, 600)
          top = pixel(raw, stride, 40, 100)
          bottom = pixel(raw, stride, 40, 500)
          assert top[0] > 180 and top[1] < 80, top
          assert bottom[2] > 150, bottom
          print("rotate/crop", top, bottom)

          # Clip: red page, blue clipped square.
          width, height, raw, stride = read_png(Path("out/clip.png"))
          corner = pixel(raw, stride, 20, 20)
          center = pixel(raw, stride, 200, 200)
          assert corner[0] > 180 and corner[1] < 80, corner
          assert center[2] > 180, center
          print("clip", corner, center)

          # Inline image: red square in the page.
          width, height, raw, stride = read_png(Path("out/inline-image.png"))
          inline = pixel(raw, stride, 200, 200)
          assert inline[0] > 180 and inline[1] < 80, inline
          print("inline image", inline)

          # Embedded TrueType: count dark pixels to ensure glyph outlines were
          # rasterized, not just advance widths.
          width, height, raw, stride = read_png(Path("out/font-embedded.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 2000, dark
          print("embedded font dark pixels", dark)

          # CFF/Type1C font: same dark-pixel check.
          width, height, raw, stride = read_png(Path("out/font-cff.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 2000, dark
          print("CFF font dark pixels", dark)

          # Type0 / CIDFontType2: two-byte Identity-H codes and CIDToGIDMap.
          width, height, raw, stride = read_png(Path("out/font-cid.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 1000, dark
          print("CID font dark pixels", dark)

          # Type1 /FontFile: eexec and charstring decryption plus outlines.
          width, height, raw, stride = read_png(Path("out/font-type1.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 2000, dark
          print("Type1 font dark pixels", dark)

          # PFA Type1: hexadecimal eexec section.
          width, height, raw, stride = read_png(Path("out/font-type1-pfa.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 2000, dark
          print("PFA Type1 dark pixels", dark)

          # CID-keyed CFF: CJK glyphs via Identity-H CIDs.
          width, height, raw, stride = read_png(Path("out/font-cid-cff.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 3000, dark
          print("CID CFF dark pixels", dark)

          # Embedded Type0 encoding CMap (Unicode codes to CIDs).
          width, height, raw, stride = read_png(Path("out/font-cid-cmap.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 3000, dark
          print("CID CMap dark pixels", dark)

          # Named Adobe CJK CMap (UniGB-UCS2-H) mapped to Adobe-GB1 CIDs.
          width, height, raw, stride = read_png(Path("out/font-named-cmap.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 3000, dark
          print("named CMap dark pixels", dark)

          # Constant alpha ExtGState: 50% blue over red must produce purple.
          width, height, raw, stride = read_png(Path("out/alpha.png"))
          center = pixel(raw, stride, 200, 200)
          red = pixel(raw, stride, 120, 120)
          blue = pixel(raw, stride, 320, 120)
          assert 80 < center[0] < 190 and center[1] < 60 and center[2] > 80, center
          assert red[0] > 200 and red[2] < 60, red
          assert blue[2] > 200 and blue[0] < 190, blue
          print("alpha", center, red, blue)

          # Multiply blend: yellow times blue is black in the overlap.
          width, height, raw, stride = read_png(Path("out/blend.png"))
          center = pixel(raw, stride, 200, 200)
          yellow = pixel(raw, stride, 120, 120)
          assert center[0] < 30 and center[1] < 30 and center[2] < 30, center
          assert yellow[0] > 200 and yellow[1] > 200 and yellow[2] < 60, yellow
          print("blend", center, yellow)

          # Exact path clip: blue triangle on a red page.
          width, height, raw, stride = read_png(Path("out/clip-path.png"))
          center = pixel(raw, stride, 200, 220)
          corner = pixel(raw, stride, 40, 40)
          assert center[2] > 180 and center[0] < 60, center
          assert corner[0] > 180 and corner[2] < 60, corner
          print("clip path", center, corner)

          # Axial shading: red on the left, blue on the right.
          width, height, raw, stride = read_png(Path("out/shading.png"))
          left = pixel(raw, stride, 20, 200)
          right = pixel(raw, stride, 380, 200)
          assert left[0] > 200 and left[2] < 80, left
          assert right[2] > 200 and right[0] < 80, right
          print("shading", left, right)

          # Shading pattern: gradient inside the rect, white outside.
          width, height, raw, stride = read_png(Path("out/pattern.png"))
          inside = pixel(raw, stride, 120, 200)
          outside = pixel(raw, stride, 40, 40)
          assert inside[0] > 120 and inside[2] > 40, inside
          assert outside[0] > 240 and outside[2] > 240, outside
          print("pattern", inside, outside)

          # Tiling pattern: blue/red checker cells on white.
          width, height, raw, stride = read_png(Path("out/tiling-pattern.png"))
          blue = pixel(raw, stride, 10, 390)
          red = pixel(raw, stride, 30, 10)
          white = pixel(raw, stride, 30, 390)
          assert blue[2] > 180 and blue[0] < 80, blue
          assert red[0] > 180 and red[2] < 80, red
          assert white[0] > 240 and white[2] > 240, white
          print("tiling", blue, red, white)

          # Uncolored tiling pattern: red squares on white.
          width, height, raw, stride = read_png(Path("out/uncolored-pattern.png"))
          red = pixel(raw, stride, 10, 390)
          white = pixel(raw, stride, 30, 390)
          assert red[0] > 180 and red[1] < 80, red
          assert white[0] > 240 and white[1] > 240, white
          print("uncolored pattern", red, white)

          # Annotation appearance stream: green widget rect on white.
          width, height, raw, stride = read_png(Path("out/annotation.png"))
          center = pixel(raw, stride, 200, 240)
          outside = pixel(raw, stride, 40, 40)
          assert center[1] > 180 and center[0] < 80, center
          assert outside[0] > 240 and outside[2] > 240, outside
          print("annotation", center, outside)

          # Widget /AS states: On is green, Off is red.
          width, height, raw, stride = read_png(Path("out/widget-states.png"))
          on = pixel(raw, stride, 150, 250)
          off = pixel(raw, stride, 290, 250)
          assert on[1] > 180 and on[0] < 80, on
          assert off[0] > 180 and off[1] < 80, off
          print("widget states", on, off)

          # Hidden OCG: the green layer must be skipped, leaving red.
          width, height, raw, stride = read_png(Path("out/optional-content.png"))
          center = pixel(raw, stride, 200, 200)
          assert center[0] > 180 and center[1] < 60, center
          print("optional content", center)

          # Hidden annotation flag: visible green widget, hidden red widget.
          width, height, raw, stride = read_png(Path("out/annotation-flags.png"))
          visible = pixel(raw, stride, 150, 250)
          hidden = pixel(raw, stride, 290, 250)
          assert visible[1] > 180 and visible[0] < 80, visible
          assert hidden[0] > 240 and hidden[2] > 240, hidden
          print("annotation flags", visible, hidden)

          # Image SMask: opaque red on the left, transparent to blue on the right.
          width, height, raw, stride = read_png(Path("out/soft-mask.png"))
          left = pixel(raw, stride, 120, 200)
          right = pixel(raw, stride, 280, 200)
          assert left[0] > 180 and left[2] < 80, left
          assert right[2] > 180 and right[0] < 80, right
          print("soft mask", left, right)

          # SVG container: dimensions and an embedded base64 PNG.
          svg = Path("out/shapes.svg").read_text(encoding="utf-8")
          assert svg.startswith("<svg")
          assert 'width="600"' in svg
          assert "data:image/png;base64," in svg
          print("svg", len(svg))

          # Vector SVG for a path-only page: paths, no embedded image.
          vector = Path("out/vector-paths.svg").read_text(encoding="utf-8")
          assert "<path" in vector
          assert "<image" not in vector
          print("vector svg", len(vector))

          # Vector SVG image: an embedded PNG image element.
          image_svg = Path("out/image-flate.svg").read_text(encoding="utf-8")
          assert "<image" in image_svg
          assert "<path" not in image_svg
          print("image svg", len(image_svg))

          # Vector clip: a clipPath element, no embedded image.
          clip_svg = Path("out/clip-path.svg").read_text(encoding="utf-8")
          assert "<clipPath" in clip_svg
          assert "<image" not in clip_svg
          print("clip svg", len(clip_svg))

          # Vector text: glyph outlines as paths.
          text_svg = Path("out/font-embedded.svg").read_text(encoding="utf-8")
          assert "<path" in text_svg
          assert "<image" not in text_svg
          print("text svg", len(text_svg))

          # Isolated transparency group: green group at 50% over blue.
          width, height, raw, stride = read_png(Path("out/transparency-group.png"))
          center = pixel(raw, stride, 200, 200)
          assert center[0] < 30, center
          assert 100 < center[1] < 160, center
          assert 100 < center[2] < 160, center
          print("transparency group", center)

          # ExtGState luminosity mask: red only on the left half.
          width, height, raw, stride = read_png(Path("out/soft-mask-extgstate.png"))
          left = pixel(raw, stride, 100, 200)
          right = pixel(raw, stride, 300, 200)
          assert left[0] > 180 and left[2] < 60, left
          assert right[2] > 180 and right[0] < 60, right
          print("extgstate soft mask", left, right)

          # Multi-page CLI: page 1 red, page 2 blue.
          for name, expected in (("page-001.png", 0), ("page-002.png", 2)):
              width, height, raw, stride = read_png(Path("out/pages") / name)
              sample = pixel(raw, stride, 50, 50)
              assert sample[expected] > 180, (name, sample)
              assert sample[0 if expected != 0 else 2] < 60, (name, sample)
          print("multi-page cli ok")
          PY

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pages
          path: out/*.png
