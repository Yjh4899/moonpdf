name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Update registry index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Type check (warnings are errors)
        run: moon check --deny-warn

      - name: Unit and integration tests
        run: moon test --target native

      - name: Render fixtures
        run: |
          mkdir -p out
          moon run --target native cmd/moonpdf -- fixtures/shapes.pdf out/shapes.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/text.pdf out/text.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/demo.pdf out/demo.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/incremental.pdf out/incremental.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/incremental-full.pdf out/incremental-full.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/xref-stream.pdf out/xref-stream.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/image-flate.pdf out/image-flate.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/image-jpeg.pdf out/image-jpeg.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/inline-image.pdf out/inline-image.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/rotate-crop.pdf out/rotate-crop.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/clip.pdf out/clip.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-embedded.pdf out/font-embedded.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-cff.pdf out/font-cff.png --scale 2
          moon run --target native cmd/moonpdf -- fixtures/font-cid.pdf out/font-cid.png --scale 2

      - name: Verify PNG output and reused-resource pixels
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def read_png(path):
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", path
              pos = 8
              idat = bytearray()
              width = height = 0
              depth = color = 0
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos + 4])[0]
                  kind = data[pos + 4:pos + 8]
                  chunk = data[pos + 8:pos + 8 + length]
                  if kind == b"IHDR":
                      width, height = struct.unpack(">II", chunk[:8])
                      depth, color = chunk[8], chunk[9]
                  elif kind == b"IDAT":
                      idat += chunk
                  pos += 12 + length
              assert depth == 8 and color == 2, (path, depth, color)
              raw = zlib.decompress(bytes(idat))
              return width, height, raw, width * 3 + 1

          def pixel(raw, stride, x, y):
              offset = y * stride + 1 + x * 3
              return tuple(raw[offset:offset + 3])

          expected = {
              "shapes.png": (600, 400),
              "text.png": (800, 600),
              "demo.png": (1200, 720),
              "incremental.png": (600, 400),
              "incremental-full.png": (600, 400),
              "xref-stream.png": (640, 400),
              "image-flate.png": (400, 400),
              "image-jpeg.png": (400, 400),
              "inline-image.png": (400, 400),
              "rotate-crop.png": (320, 600),
              "clip.png": (400, 400),
              "font-embedded.png": (680, 300),
              "font-cff.png": (680, 300),
              "font-cid.png": (680, 300),
          }
          for name, size in expected.items():
              width, height, raw, stride = read_png(Path("out") / name)
              assert (width, height) == size, (name, width, height)
              print(f"{name}: {width}x{height}")

          # Incremental update: old Form XObject header (blue) is reused, and the
          # appended body stream (green) is rendered below it.
          width, height, raw, stride = read_png(Path("out/incremental.png"))
          blue = pixel(raw, stride, 500, 40)
          green = pixel(raw, stride, 500, 250)
          assert blue[2] > 150 and blue[0] < 100, blue
          assert green[1] > 120 and green[2] < 120, green
          print("incremental: reused header", blue, "new body", green)
          assert (Path("out/incremental.png").read_bytes()
                  == Path("out/incremental-full.png").read_bytes()), "incremental != full rewrite"

          # Xref-stream/object-stream/Flate fixture: blue rectangle from the page.
          width, height, raw, stride = read_png(Path("out/xref-stream.png"))
          blue = pixel(raw, stride, 100, 100)
          assert blue[2] > 150 and blue[0] < 100, blue
          print("xref-stream: page content", blue)

          # JPEG quadrants (red/blue/green/yellow).
          width, height, raw, stride = read_png(Path("out/image-jpeg.png"))
          red = pixel(raw, stride, 140, 140)
          blue = pixel(raw, stride, 260, 140)
          green = pixel(raw, stride, 140, 260)
          yellow = pixel(raw, stride, 260, 260)
          assert red[0] > 150 and red[1] < 90, red
          assert blue[2] > 150 and blue[0] < 90, blue
          assert green[1] > 150 and green[0] < 90, green
          assert yellow[0] > 180 and yellow[2] < 120, yellow
          print("jpeg quadrants", red, blue, green, yellow)

          # Rotate 90 + CropBox: red top half, blue bottom half.
          width, height, raw, stride = read_png(Path("out/rotate-crop.png"))
          assert (width, height) == (320, 600)
          top = pixel(raw, stride, 40, 100)
          bottom = pixel(raw, stride, 40, 500)
          assert top[0] > 180 and top[1] < 80, top
          assert bottom[2] > 150, bottom
          print("rotate/crop", top, bottom)

          # Clip: red page, blue clipped square.
          width, height, raw, stride = read_png(Path("out/clip.png"))
          corner = pixel(raw, stride, 20, 20)
          center = pixel(raw, stride, 200, 200)
          assert corner[0] > 180 and corner[1] < 80, corner
          assert center[2] > 180, center
          print("clip", corner, center)

          # Inline image: red square in the page.
          width, height, raw, stride = read_png(Path("out/inline-image.png"))
          inline = pixel(raw, stride, 200, 200)
          assert inline[0] > 180 and inline[1] < 80, inline
          print("inline image", inline)

          # Embedded TrueType: count dark pixels to ensure glyph outlines were
          # rasterized, not just advance widths.
          width, height, raw, stride = read_png(Path("out/font-embedded.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 2000, dark
          print("embedded font dark pixels", dark)

          # CFF/Type1C font: same dark-pixel check.
          width, height, raw, stride = read_png(Path("out/font-cff.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 2000, dark
          print("CFF font dark pixels", dark)

          # Type0 / CIDFontType2: two-byte Identity-H codes and CIDToGIDMap.
          width, height, raw, stride = read_png(Path("out/font-cid.png"))
          dark = 0
          for y in range(height):
              for x in range(width):
                  if pixel(raw, stride, x, y)[0] < 128:
                      dark += 1
          assert dark > 1000, dark
          print("CID font dark pixels", dark)
          PY

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pages
          path: out/*.png
